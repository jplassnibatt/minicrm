<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniCRM</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = localStorage.getItem('csm-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <div class="brand-name">MiniCRM</div>
          <div class="brand-sub">CSM priority accounts</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/buckets" data-view="buckets"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h10M4 19h6"/></svg>Buckets</a>
        <a href="#/book" data-view="book"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 1 3-3h11"/></svg>Book of business</a>
        <a href="#/noar" data-view="noar"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5M10.3 4.2 2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z"/></svg>No autorenew<span class="nav-count" id="nav-noar"></span></a>
        <a href="#/notes" data-view="notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5"/></svg>Notes log<span class="nav-count" id="nav-notes"></span></a>
        <a href="#/activity" data-view="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</a>
        <a href="#/api" data-view="api"><svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg>API</a>
      </nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="export-btn" type="button">Export data</button>
        <button class="ghost-btn" id="import-btn" type="button">Import data</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
        <button class="ghost-btn" id="theme-btn" type="button">Toggle theme</button>
        <button class="ghost-btn" id="update-btn" type="button">Check for updates</button>
        <p class="foot-note"><span id="app-version"></span><br>Found a bug? Have an issue?<br><a class="ext" href="https://github.com/jplassnibatt/minicrm/issues" target="_blank" rel="noopener noreferrer">Open an issue on GitHub</a></p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title"></h1>
          <p class="view-sub" id="view-sub"></p>
        </div>
        <div class="topbar-actions">
          <div class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search account, owner, renewal manager" autocomplete="off">
          </div>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <dialog id="drawer" aria-label="Account details"></dialog>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
